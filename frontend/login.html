<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>SimplyNote - Login</title>
    <link rel="icon" type="image/x-icon" href="assets/static/png-bow.jpg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <link rel="stylesheet" href="../frontend/assets/css/styles.css">
    <style>
        /* For jQuery Validate error messages */
        .error {
            color: red;
            font-size: 0.9em;
            display: block; /* Ensure error messages are on their own line if needed */
        }
    </style>
</head>

<body>
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="col-md-6">
      <div class="card shadow-lg p-4 rounded-3">
          <h2 class="text-center mb-4">Login</h2>
          <form id="login-form">
              <div class="form-group mb-3">
                  <label for="username" class="form-label">Username:</label>
                  <input type="text" class="form-control rounded-2" id="username" name="username" placeholder="Enter username">
              </div>
              <div class="form-group mb-3">
                  <label for="password" class="form-label">Password:</label>
                  <input type="password" class="form-control rounded-2" id="password" name="password" placeholder="Enter password">
              </div>
              <button type="submit" class="btn btn-primary w-100 rounded-2">Login</button>
              <p class="text-center mt-3">Don't have an account? <a href="register.html">Register</a></p>
          </form>
      </div>
  </div>
</div>

    <script src="../frontend/assets/js/jquery.min.js"></script>

    <script src="../frontend/assets/js/jquery.validate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

    <script src="../frontend/utils/constants.js"></script>
    <script src="../frontend/utils/utils.js"></script>
    <script src="../frontend/services/user-service.js"></script>

    <script type="text/javascript">
        $(document).ready(function() {
            // Initialize Toastr options (optional)
            toastr.options = {
                "closeButton": true,
                "progressBar": true,
                "positionClass": "toast-top-right",
                "preventDuplicates": true,
            };
            // Initialize UserService for this page
            UserService.init();
        });
    </script>

</body>
</html>
