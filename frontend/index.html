<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>SimplyNote</title>
    <link rel="icon" type="image/x-icon" href="assets/static/png-bow.jpg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <link rel="stylesheet" href="../frontend/assets/css/styles.css">
    <link rel="stylesheet" href="../frontend/assets/css/spapp.css">
    <style> .error { color: red; font-size: 0.9em; } </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container px-5">
            <a class="navbar-brand" href="#home" style="color: #e1a8a8;">SimplyNote</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0" id="menuTabs">
                    <li class="nav-item"><span class="nav-link text-muted">Loading menu...</span></li>
                </ul>
            </div>
        </div>
    </nav>
    <main id="spapp" role="main">
        <section id="home" data-load="home.html"></section>
        <section id="profile"></section>
        <section id="admin-dashboard" data-load="admin-dashboard.html"></section>
        <section id="about-us" data-load="about-us.html"></section>
    </main>
    <footer class="bg-dark text-white py-4">
        <div class="container px-5"><div class="row justify-content-center"><div class="col-lg-6 text-center">
            <p class="m-0" style="color: #e1a8a8;">© 2025 SimplyNote. All rights reserved.</p>
        </div></div></div>
    </footer>

    <script src="../frontend/assets/js/jquery.min.js"></script>
    <script src="../frontend/assets/js/jquery.validate.min.js"></script>
    <script src="../frontend/assets/js/jquery.spap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script src="../frontend/utils/constants.js"></script>
    <script src="../frontend/utils/utils.js"></script>
    <script src="../frontend/services/user-service.js"></script>
    <script src="../frontend/assets/js/script.js"></script> 

    <script type="text/javascript">
        // This inline script is primarily for Toastr options.
        // SPAPP and UserService initialization is now expected to be handled
        // by script.js and user-service.js respectively.
        $(document).ready(function() {
            console.log("index.html: Document ready (inline script).");
            toastr.options = {
                "closeButton": true, "progressBar": true,
                "positionClass": "toast-top-right", "preventDuplicates": true,
            };
            // UserService.init() is called at the bottom of user-service.js
            // SPAPP initialization is expected in script.js
        });
    </script>
</body>
</html>
